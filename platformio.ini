[platformio]
default_envs = custom_h723
; PC별 COM 포트/디버거 일련번호는 추적하지 않는 로컬 ini에서 덮어쓴다.
; 파일이 없으면 기본 설정을 사용한다. 예시는 hardware/ST_Link에 있다.
extra_configs = platformio.local*.ini

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ==============================================================================
;  Common settings shared by all environments
; ==============================================================================
[common]
platform = ststm32
framework = arduino
lib_archive = false
lib_deps =
    askuric/Simple FOC@^2.3.4
monitor_speed = 115200

; ==============================================================================
;  Nucleo-G431RB (default — 3PWM, USART2 via ST-LINK)
; ==============================================================================
[env:nucleo_g431rb]
platform = ${common.platform}
board = nucleo_g431rb
framework = ${common.framework}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = send_on_enter

build_flags =
    ; SPI pin remapping: SPI1 MOSI -> PB5, SPI2 on PB13/PB14/PB15
    -D PIN_SPI_MOSI=PB5
    -D PIN_SPI_MISO=PA6
    -D PIN_SPI_SCK=PA5
    ; Enlarged TX buffer for non-blocking telemetry
    -D SERIAL_TX_BUFFER_SIZE=512

; ==============================================================================
;  Custom 48-Pin Board (6PWM, USART3)
;  Programmer: Nucleo-F767ZI ST-Link V2 (CN4 jumpers removed, CN6 → J1)
;  Serial: USART3 PB10(TX) → F767ZI PD8(STLINK_RX) → USB VCP → PC
; ==============================================================================
[env:custom_board]
platform = ${common.platform}
board = nucleo_g431rb
framework = ${common.framework}
lib_archive = ${common.lib_archive}                                                                                                                 
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = send_on_enter, log2file
extra_scripts = pre:patch_hse.py

; ★ F767ZI ST-Link V2 as external programmer
upload_protocol = stlink
upload_flags =
    -c
    set CPUTAPID 0x2ba01477
debug_tool = stlink

build_flags =
    -D USE_CUSTOM_BOARD
    -D USE_HSI_CLOCK
    ; ★ USE_HSI_16MHZ_ONLY 제거 → HSI+PLL=170MHz (PWM 해상도 3400 카운트)
    ; -D HSE_VALUE=16000000UL  ; HSE disabled for now
    ; ★ Serial via USART3 (PB10=TX → F767ZI PD8 → VCP → PC)
    -D PIN_SERIAL_TX=PB10
    -D PIN_SERIAL_RX=PB11
    ; SPI1 default pins (PA5/PA6/PA7)
    -D PIN_SPI_MOSI=PA7
    -D PIN_SPI_MISO=PA6
    -D PIN_SPI_SCK=PA5
    ; Enlarged TX buffer for non-blocking telemetry
    -D SERIAL_TX_BUFFER_SIZE=512

; ==============================================================================
;  Custom 48-Pin Board — BENCH TEST (motor-free hardware verification)
;  Programmer: Nucleo-F767ZI ST-Link V2 (CN4 jumpers removed, CN6 → J1)
;  Serial: USART3 PB10(TX) → F767ZI PD8(STLINK_RX) → USB VCP → PC
;  Upload: pio run -e custom_board_bench -t upload
;  Monitor: pio device monitor -e custom_board_bench
; ==============================================================================
[env:custom_board_bench]
platform = ${common.platform}
board = nucleo_g431rb
framework = ${common.framework}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = send_on_enter
extra_scripts = pre:patch_hse.py

; ★ F767ZI ST-Link V2 as external programmer
upload_protocol = stlink
upload_flags =
    -c
    set CPUTAPID 0x2ba01477
debug_tool = stlink

build_flags =
    -D USE_CUSTOM_BOARD
    -D BENCH_TEST_MODE
    -D USE_HSI_CLOCK
    ; ★ HSI 전용 — HSE 크리스탈 미동작 확인, 내부 16MHz 클럭 사용
    ; -D HSE_VALUE=16000000UL  ; HSE disabled for now
    ; ★ Serial via USART3 (PB10=TX → F767ZI PD8 → VCP → PC)
    -D PIN_SERIAL_TX=PB10
    -D PIN_SERIAL_RX=PB11
    -D PIN_SPI_MOSI=PA7
    -D PIN_SPI_MISO=PA6
    -D PIN_SPI_SCK=PA5
    -D SERIAL_TX_BUFFER_SIZE=512

; STM32H723ZGT6 custom PCB; CubeMX source: hardware/STM32_H723/cubemx
; PC USB -> STLINK-V3MODS -> H723 SWD(업로드/디버그) + UART(VCP 로그/명령).
[env:custom_h723]
platform = ${common.platform}
board = custom_h723
framework = ${common.framework}
lib_archive = ${common.lib_archive}
monitor_speed = ${common.monitor_speed}
monitor_filters = send_on_enter, log2file
upload_protocol = stlink
debug_tool = stlink
; ST-Link V3에 SWD 속도를 명시한다(kHz). 디버그 및 업로드 설정에 함께 적용된다.
debug_speed = 4000
build_flags =
    -D USE_CUSTOM_BOARD
    -D USE_H723_BOARD
    -D ENCODER_TLI49012
    -D USE_PWR_LDO_SUPPLY
    -D ARDUINO_GENERIC_H723ZGTX
    ; Micro-B ST-Link VCP <-> UART5(PC12 TX / PD2 RX). USB CDC는 모듈이 담당한다.
    -D SERIAL_UART_INSTANCE=5
    -D PIN_SERIAL_TX=PC12
    -D PIN_SERIAL_RX=PD2
    -D PIN_SPI_MOSI=PD7
    -D PIN_SPI_MISO=PA6
    -D PIN_SPI_SCK=PA5
    -D SERIAL_TX_BUFFER_SIZE=512

; Encoder-only firmware: no motor/PWM/ADC startup, DRVOFF held HIGH.
; 엔코더 단독 시험은 아래 환경을 선택한다. 일반 앱의 부팅 중 FOC 정렬을 실행하지 않는다.
[env:custom_h723_encoder]
extends = env:custom_h723
build_flags =
    ${env:custom_h723.build_flags}
    -D ENCODER_TEST_MODE
build_src_filter =
    -<*>
    +<encoder/TLI49012Sensor.cpp>
    +<encoder/EncoderCalibration.cpp>
    +<encoder/encoder_bench.cpp>
    +<mcu/clock_h723.cpp>
