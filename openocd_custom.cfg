# Custom OpenOCD script to bypass target voltage check
# The ST-Link V3 firmware checks T_VCC before connecting.
# We use "connect_under_reset" to force connection.

source [find interface/stlink.cfg]
transport select hla_swd
adapter speed 480

# Force connection mode
reset_config none

source [find target/stm32g4x.cfg]

# Override the init to catch voltage warnings
proc init_target_voltage_bypass {} {
    init
}
